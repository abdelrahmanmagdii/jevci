# .jevci.yaml used for planning the kueue benchmark suite.
safety:
  unattributed_files: run_all
  ignore_files:
    - "**/*.md"
    - "docs/**"
    - ".github/**"
    - ".gitlab-ci.yml"
    - ".circleci/**"
    - ".travis.yml"
    - "LICENSE*"
    - "NOTICE*"
    - "CHANGELOG*"
    - "CHANGELOG/**"
    - "CODEOWNERS"
    - ".gitignore"
    - ".gitattributes"
    - ".editorconfig"
    - ".golangci.yml"
    - ".golangci.yaml"
    - ".goreleaser.yml"
    - ".goreleaser.yaml"
    - ".pre-commit-config.yaml"
    - "Makefile"
    - "Makefile.*"
    - "VERSION"
    - "OWNERS"
    - "**/OWNERS"
    - "OWNERS_ALIASES"
    - "SECURITY_CONTACTS"
    - "keps/**"
    - ".jevci.yaml"
    # kueue-specific non-Go trees and generated docs/data
    - "config/**"
    - "charts/**"
    - "hack/**"
    - "cloudbuild*.yaml"
    - "netlify.toml"
    - "release-timelines/**"
    - "site/**"
    - "test/compatibility_lifecycle/**"
